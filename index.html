    function Footer() {
      const [copied, setCopied] = useState(false);
      const [time, setTime] = useState("");

      useEffect(() => {
        const updateTime = () => {
          const now = new Date();
          const h = String(now.getUTCHours()).padStart(2, '0');
          const m = String(now.getUTCMinutes()).padStart(2, '0');
          const s = String(now.getUTCSeconds()).padStart(2, '0');
          setTime(h + ':' + m + ':' + s + ' UTC');
        };
        updateTime();
        const interval = setInterval(updateTime, 1000);
        return () => clearInterval(interval);
      }, []);

      const copyEmail = () => {
        navigator.clipboard.writeText("hello@beyondformsmedia.com");
        setCopied(true);
        setTimeout(() => setCopied(false), 2200);
      };

      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <footer id="footer" className="py-16 md:py-24 px-4 sm:px-6 md:px-12 bg-[#09090A] border-t border-white/[0.08]">
          <div className="max-w-7xl mx-auto flex flex-col items-center text-center">
            <button onClick={scrollToTop} className="mb-6 font-mono text-xs uppercase tracking-widest text-[#8E8E93] hover:text-emerald transition-colors flex items-center gap-1">
              <span>Back to top</span>
              <span>↑</span>
            </button>

            <span className="font-mono text-xs uppercase tracking-widest text-emerald font-semibold">BEYOND FORMS MEDIA</span>
            <h2 className="mt-3 text-3xl sm:text-6xl font-extrabold tracking-tight text-[#F4F4F0]">Ready to build something iconic?</h2>
            
            <button onClick={copyEmail} className="mt-6 px-5 sm:px-6 py-3 rounded-full border border-white/15 bg-white/5 font-mono text-xs sm:text-sm text-[#F4F4F0] hover:bg-white/10 hover:border-emerald/50 transition-colors">
              {copied ? "✓ Copied to clipboard!" : "hello@beyondformsmedia.com (Click to Copy)"}
            </button>

            <div className="mt-12 flex flex-col sm:flex-row items-center justify-between w-full pt-8 border-t border-white/5 text-xs font-mono text-[#8E8E93] gap-3">
              <div>&copy; {new Date().getFullYear()} Beyond Forms Media. All rights reserved.</div>
              <div className="flex items-center gap-2">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald animate-pulse-dot" />
                <span>STUDIO CLOCK: {time}</span>
              </div>
            </div>
          </div>
        </footer>
      );
    }

    /* ═══════════════════════════════════════════════
       ROOT APP
       ═══════════════════════════════════════════════ */
    function App() {
      const [selectedProject, setSelectedProject] = useState(null);
      const [isBookingOpen, setIsBookingOpen] = useState(false);

      const openBooking = () => setIsBookingOpen(true);

      return (
        <div className="min-h-screen bg-[#09090A] text-[#F4F4F0]">
          <Header onBookCall={openBooking} />
          
          <main className="w-full">
            <Hero />
            <AboutSection onBookCall={openBooking} />
            <Marquee />
            <SelectedWork onProjectClick={(p) => setSelectedProject(p)} />
            <Services onBookCall={openBooking} />
            <ProductionSystem />
            <Testimonials />
            <FAQ />
            <Footer />
          </main>

          <ProjectModal project={selectedProject} isOpen={!!selectedProject} onClose={() => setSelectedProject(null)} />
          <BookingModal isOpen={isBookingOpen} onClose={() => setIsBookingOpen(false)} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
